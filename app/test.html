<!doctype html>
<html><head><meta charset="utf-8"><title>format round-trip</title>
<style>body{font:13px/1.5 ui-monospace,monospace;padding:20px;background:#111;color:#ddd}
.ok{color:#7ec87e}.bad{color:#ff7b6b}pre{white-space:pre-wrap;margin:2px 0 10px 18px;color:#9aa}
h2{font-size:14px;margin:18px 0 6px}</style></head><body>
<h1 id="head">running…</h1><div id="out"></div>
<script type="module">
import { htmlToMd, mdToHtml, parseNote, serializeNote, inlineToHtml, __test } from './js/app.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;

const norm = h => {
  if (typeof h !== 'string') return String(h);
  const d = document.createElement('div'); d.innerHTML = h;
  return d.innerHTML.replace(/\s+/g, ' ').trim();
};

function t(name, got, want) {
  const ok = norm(got) === norm(want);
  ok ? pass++ : fail++;
  out.insertAdjacentHTML('beforeend',
    `<div class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'} ${name}</div>` +
    (ok ? '' : `<pre>got : ${norm(got).replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;')}
want: ${norm(want).replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;')}</pre>`));
}

/** html -> md -> html must land back on the same html */
function trip(name, html) { t(name, mdToHtml(htmlToMd(html)), html); }

out.insertAdjacentHTML('beforeend', '<h2>HTML → Markdown → HTML</h2>');
trip('paragraph',        '<p>Hello world</p>');
trip('bold/italic',      '<p><strong>bold</strong> and <em>italic</em> text</p>');
trip('underline',        '<p><u>underlined</u></p>');
trip('strike',           '<p><s>gone</s></p>');
trip('heading',          '<h1>Agenda</h1>');
trip('h2 + para',        '<h2>Notes</h2><p>body</p>');
trip('bullets',          '<ul><li>one</li><li>two</li></ul>');
trip('numbers',          '<ol><li>first</li><li>second</li></ol>');
trip('nested bullets',   '<ul><li>a<ul><li>b</li></ul></li><li>c</li></ul>');
trip('link',             '<p>see <a href="https://x.dev/a_b">the docs</a></p>');
trip('wiki link',        '<p>see <a class="wiki" data-note="Other Note" href="#">Other Note</a></p>');
trip('text colour',      '<p><span style="color:#d8574b">red</span> normal</p>');
trip('highlight',        '<p><span style="background:#ffe479">lit</span></p>');
trip('inline code',      '<p>run <code>ls -la</code> now</p>');
trip('code block',       '<pre>const x = 1;\nconst y = 2;</pre>');
trip('blockquote',       '<blockquote><p>quoted</p></blockquote>');
trip('table',            '<table><thead><tr><th>a</th><th>b</th></tr></thead><tbody><tr><td>1</td><td>2</td></tr></tbody></table>');
trip('mixed',            '<h1>T</h1><p>intro <strong>x</strong></p><ul><li>bullet</li></ul>');
trip('empty',            '<p><br></p>');
trip('line break',       '<p>one<br>two</p>');

out.insertAdjacentHTML('beforeend', '<h2>Characters that must survive</h2>');
t('asterisks kept',  mdToHtml(htmlToMd('<p>2 * 3 * 4</p>')), '<p>2 * 3 * 4</p>');
t('underscores',     mdToHtml(htmlToMd('<p>snake_case_name</p>')), '<p>snake_case_name</p>');
t('brackets',        mdToHtml(htmlToMd('<p>array[0] and [text]</p>')), '<p>array[0] and [text]</p>');
t('angle + amp',     mdToHtml(htmlToMd('<p>a &lt; b &amp;&amp; c &gt; d</p>')), '<p>a &lt; b &amp;&amp; c &gt; d</p>');
t('backtick',        mdToHtml(htmlToMd('<p>a ` b</p>')), '<p>a ` b</p>');
t('hash mid-line',   mdToHtml(htmlToMd('<p>issue #42 filed</p>')), '<p>issue #42 filed</p>');
t('dash start',      mdToHtml(htmlToMd('<p>- not a bullet</p>')), '<p>- not a bullet</p>');
t('pipe in headerless table',
  mdToHtml(htmlToMd('<table><tbody><tr><td>a|b</td></tr></tbody></table>')),
  '<table><tbody><tr><td>a|b</td></tr></tbody></table>');

out.insertAdjacentHTML('beforeend', '<h2>Markdown → HTML</h2>');
t('md bullets',   mdToHtml('- one\n- two'), '<ul><li>one</li><li>two</li></ul>');
t('md nested',    mdToHtml('- a\n  - b'),   '<ul><li>a<ul><li>b</li></ul></li></ul>');
t('md heading',   mdToHtml('## Two'),        '<h2>Two</h2>');
t('md bold',      mdToHtml('a **b** c'),     '<p>a <strong>b</strong> c</p>');
t('md escaped *', mdToHtml('a \\*b\\* c'),   '<p>a *b* c</p>');
t('md table',     mdToHtml('| a | b |\n| --- | --- |\n| 1 | 2 |'),
   '<table><thead><tr><th>a</th><th>b</th></tr></thead><tbody><tr><td>1</td><td>2</td></tr></tbody></table>');

out.insertAdjacentHTML('beforeend', '<h2>Fenced code blocks</h2>');

const codeText = '  const x = "<tag>";  \n\n# not a heading\n- not a list\n| not | a table |';
const codeHtml = mdToHtml('```js\n' + codeText + '\n```');
const codeHost = document.createElement('div');
codeHost.innerHTML = codeHtml;
const codeNode = codeHost.querySelector('pre code');
t('fence becomes a code block', codeNode?.textContent === codeText, true);
t('language annotation is kept', codeNode?.className, 'language-js');
t('code markup is inert text', codeHost.querySelector('h1, ul, table') === null, true);
t('literal HTML is escaped in code', codeHtml.includes('&lt;tag&gt;'), true);

const spacedCode = '<pre>first  \n\n\n  second\n</pre>';
t('code whitespace survives round trip', (() => {
  const host = document.createElement('div');
  host.innerHTML = mdToHtml(htmlToMd(spacedCode));
  return host.querySelector('pre')?.textContent === 'first  \n\n\n  second\n';
})(), true);

const ticks = '<pre>before\n```\nafter</pre>';
const tickMd = htmlToMd(ticks);
t('embedded backticks choose a longer fence', tickMd.startsWith('````\n'), true);
t('embedded backticks survive round trip', (() => {
  const host = document.createElement('div');
  host.innerHTML = mdToHtml(tickMd);
  return host.querySelector('pre')?.textContent === 'before\n```\nafter';
})(), true);

const languageBlock = '<pre><code class="language-python">print("ok")</code></pre>';
t('language survives writer and reader', mdToHtml(htmlToMd(languageBlock)), languageBlock);
t('tilde fences are read', mdToHtml('~~~\na &lt; b\n~~~'), '<pre>a &amp;lt; b</pre>');

t('code survives a file', (() => {
  const doc = { meta: { title: 'Code', created: '01JAN2026', modified: '01JAN2026',
                        font: 'Roboto', view: null },
                elements: [{ id: 't1', type: 'text', x: 0, y: 0, w: 300,
                             html: '<pre>  one\n\n# two\n```</pre>' }] };
  const host = document.createElement('div');
  host.innerHTML = parseNote(serializeNote(doc)).elements[0].html;
  return host.querySelector('pre')?.textContent === '  one\n\n# two\n```';
})(), true);

out.insertAdjacentHTML('beforeend', '<h2>Pipe-prefixed prose</h2>');

// A line opening with | that has no divider row under it is not a table. It
// used to be turned away by the table branch and by the paragraph loop alike,
// so mdToHtml() spun on it without ever consuming it. A hang cannot be caught
// on the thread it happens on, so these cases run in a worker that is
// terminated if it stops answering: a regression fails here instead of
// freezing the whole suite.
const pipeCases = [
  ['bare pipe',           '|',                            '<p>|</p>'],
  ['pipe-prefixed prose', '| ordinary text',              '<p>| ordinary text</p>'],
  ['no space after pipe', '|tight',                       '<p>|tight</p>'],
  ['incomplete table',    '| a | b |\n| 1 | 2 |',         '<p>| a | b | | 1 | 2 |</p>'],
  ['header row alone',    '| a | b |',                    '<p>| a | b |</p>'],
  ['escaped literal pipe', 'a \\| b',                      '<p>a | b</p>'],
  ['prose then a table',  'intro\n| a | b |\n| --- | --- |\n| 1 | 2 |',
    '<p>intro</p><table><thead><tr><th>a</th><th>b</th></tr></thead>' +
    '<tbody><tr><td>1</td><td>2</td></tr></tbody></table>'],
];

// The worker gets app.js as text and runs it with the handful of browser
// globals its top level touches, so the parser under test is the shipped one.
const WORKER_SRC = `
onmessage = e => {
  const noop = () => {};
  const node = () => ({ style: {}, dataset: {}, children: [], childNodes: [],
    innerHTML: '', textContent: '', append: noop, appendChild: noop, setAttribute: noop,
    getAttribute: () => null, addEventListener: noop, querySelector: () => null,
    querySelectorAll: () => [], classList: { add: noop, remove: noop, toggle: noop, contains: () => false } });
  const document = { createElement: node, createElementNS: node, createTextNode: node,
    createDocumentFragment: node, createRange: node, body: node(), head: node(),
    documentElement: node(), querySelector: () => null, querySelectorAll: () => [],
    getElementById: () => null, addEventListener: noop, removeEventListener: noop,
    execCommand: noop, getSelection: () => null };
  const window = { addEventListener: noop, removeEventListener: noop, devicePixelRatio: 1,
    getComputedStyle: () => ({}), location: { href: '', hash: '' },
    matchMedia: () => ({ matches: false, addEventListener: noop, addListener: noop }) };
  const localStorage = { getItem: () => null, setItem: noop, removeItem: noop };
  const parse = new Function('document', 'window', 'localStorage', 'navigator', 'fetch',
    e.data.src + '\\n; return mdToHtml;')(document, window, localStorage,
    { userAgent: '', platform: '', sendBeacon: noop }, () => new Promise(noop));
  postMessage(e.data.cases.map(parse));
};
`;

const parsed = await (async () => {
  const src = (await (await fetch('./js/app.js')).text()).replace(/^export /gm, '');
  const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
  const worker = new Worker(url);
  try {
    return await new Promise(resolve => {
      const bell = setTimeout(() => resolve({ error: 'timed out after 3s' }), 3000);
      worker.onmessage = ev => { clearTimeout(bell); resolve(ev.data); };
      worker.onerror = ev => { clearTimeout(bell); resolve({ error: ev.message || 'worker error' }); };
      worker.postMessage({ src, cases: pipeCases.map(c => c[1]) });
    });
  } finally { worker.terminate(); URL.revokeObjectURL(url); }
})();

if (!Array.isArray(parsed)) {
  t('mdToHtml answers on pipe-prefixed lines', parsed.error, 'an answer');
} else {
  pipeCases.forEach(([name, , want], k) => t(name, parsed[k], want));

  // Only now that the parser is known to return is it safe to run the same
  // text through the page's own thread.
  trip('pipe-prefixed paragraph', '<p>| ordinary text</p>');
  t('pipe-prefixed prose survives a file', (() => {
    const md = '---\ntitle: T\nelements:\n  - id: t1\n    type: text\n---\n\n<!--@t1-->\n| ordinary text';
    return parseNote(serializeNote(parseNote(md))).elements[0].html;
  })(), '<p>| ordinary text</p>');
}

out.insertAdjacentHTML('beforeend', '<h2>Font size and complex tables</h2>');
trip('font size span',  '<p>a <span style="font-size:24px">big</span> word</p>');
trip('size + colour',   '<p><span style="color:#4a7fd4;font-size:20px">both</span></p>');
t('size survives file',
  (() => { const d = { meta: { title: 'S', created: '01JAN2026', modified: '01JAN2026',
                               font: 'Roboto', view: null },
                       elements: [{ id: 't1', type: 'text', x: 0, y: 0, w: 300,
                                    html: '<p><span style="font-size:32px">huge</span></p>' }] };
           return parseNote(serializeNote(d)).elements[0].html; })(),
  '<p><span style="font-size:32px">huge</span></p>');

// Header absence, merged cells and hidden rules have no pipe-table spelling ->
// raw HTML block. In particular, treating the first row of a td-only table as
// a pipe-table header changes the Header-off setting when the note reopens.
const headerless = '<table><tbody><tr><td>a</td><td><strong>b</strong></td></tr>' +
  '<tr><td>1</td><td><em>2</em></td></tr></tbody></table>';
t('headerless -> html block', htmlToMd(headerless).startsWith('<table>'), true);
trip('headerless round trip', headerless);
t('headerless keeps row content and formatting', mdToHtml(htmlToMd(headerless)), headerless);
t('headerless survives a file', (() => {
  const d = { meta: { title: 'T', created: '01JAN2026', modified: '01JAN2026',
                      font: 'Roboto', view: null },
              elements: [{ id: 't1', type: 'text', x: 0, y: 0, w: 300,
                           html: headerless }] };
  return parseNote(serializeNote(d)).elements[0].html;
})(), headerless);
t('header off stays off', (() => {
  const host = document.createElement('div');
  host.innerHTML = '<table><thead><tr><th>a</th><th>b</th></tr></thead>' +
    '<tbody><tr><td>1</td><td>2</td></tr></tbody></table>';
  __test.M_table.toggleHeaderRow(host.querySelector('table'));
  const d = { meta: { title: 'T', created: '01JAN2026', modified: '01JAN2026',
                      font: 'Roboto', view: null },
              elements: [{ id: 't1', type: 'text', x: 0, y: 0, w: 300,
                           html: host.innerHTML }] };
  const back = document.createElement('div');
  back.innerHTML = parseNote(serializeNote(d)).elements[0].html;
  return __test.M_table.hasHeaderRow(back.querySelector('table'));
})(), false);

const merged = '<table><tr><th colspan="2">Span</th></tr><tr><td>1</td><td>2</td></tr></table>';
t('merged -> html block', htmlToMd(merged).startsWith('<table>'), true);
trip('merged round trip', merged);
const borderless = '<table data-borders="off"><tr><td>a</td><td>b</td></tr></table>';
t('borderless -> html block', htmlToMd(borderless).includes('data-borders'), true);
trip('borderless round trip', borderless);
const rowspan = '<table><tr><td rowspan="2">tall</td><td>x</td></tr><tr><td>y</td></tr></table>';
trip('rowspan round trip', rowspan);
t('plain table stays pipes',
  htmlToMd('<table><thead><tr><th>a</th></tr></thead><tbody><tr><td>1</td></tr></tbody></table>')
    .startsWith('|'), true);
trip('header table round trip',
  '<table><thead><tr><th>a</th></tr></thead><tbody><tr><td>1</td></tr></tbody></table>');
t('html table amid text',
  mdToHtml('before\n\n' + merged + '\n\nafter').includes('colspan="2"'), true);

t('empty cells stay empty',
  htmlToMd('<table><tr><th><br></th><th>x</th></tr><tr><td><br></td><td><br></td></tr></table>'),
  '|   | x |\n| --- | --- |\n|   |   |');
trip('empty table round trip',
  '<table><thead><tr><th><br></th><th><br></th></tr></thead><tbody><tr><td><br></td><td><br></td></tr></tbody></table>');
t('break inside a cell',
  htmlToMd('<table><tr><td>a<br>b</td></tr></table>').includes('a<br>b'), true);

// row numbers, a line colour and dragged sizes are all table state a pipe table
// cannot spell, so each one has to push the table out to a raw HTML block
const numbered = '<table data-numbers="on"><tr><td>a</td><td>b</td></tr></table>';
t('row numbers -> html block', htmlToMd(numbered).includes('data-numbers="on"'), true);
trip('row numbers round trip', numbered);

const tinted = '<table style="--tbl-line: #d8574b;"><tr><td>a</td></tr></table>';
t('line colour -> html block', htmlToMd(tinted).includes('--tbl-line'), true);
trip('line colour round trip', tinted);

// the thead/tbody split has to survive, or the table that comes back is not the
// one that went out and no two states of it can be told apart
const split = '<table data-numbers="on"><thead><tr><th>a</th></tr></thead>'
  + '<tbody><tr><td>1</td></tr></tbody></table>';
t('section split written out', htmlToMd(split).includes('<thead>'), true);
trip('section split round trip', split);
t('header still reads as a header',
  (() => { const d = document.createElement('div'); d.innerHTML = mdToHtml(htmlToMd(split));
           return d.querySelector('tr').children[0].tagName; })(), 'TH');

const sized = '<table style="table-layout: fixed; width: 240px;">' +
  '<colgroup><col style="width: 90px;"><col style="width: 150px;"></colgroup>' +
  '<tr style="height: 44px;"><td>a</td><td>b</td></tr></table>';
t('column widths -> html block', htmlToMd(sized).includes('<colgroup>'), true);
t('row height kept', htmlToMd(sized).includes('height: 44px'), true);
trip('sized table round trip', sized);

t('sized table survives a file', (() => {
  const d = parseNote(serializeNote(parseNote('---\ntitle: T\nelements:\n  - id: t1\n    type: text\n---\n\n<!--@t1-->\n' + sized)));
  return d.elements[0].html;
})(), sized);

out.insertAdjacentHTML('beforeend', '<h2>Merged table editing</h2>');
{
  // The grid map holds one spanning cell in several slots at once, so a loop
  // over slots must not mistake those for several cells: that is how a rowspan
  // used to grow twice over, and how a merged cell used to be decremented into
  // deletion. Everything here is driven through the real M_table helpers.
  const tbl = __test.M_table;

  // rowspan=2 colspan=2 'merged' on the left, A and B down the right-hand edge
  const fixture = (html) => {
    const host = document.createElement('div');
    // colspan before rowspan is the order the writer emits, so a table that
    // has been through a file still compares as the same string.
    host.innerHTML = html || '<table><tbody>' +
      '<tr><td colspan="2" rowspan="2">merged</td><td>A</td></tr>' +
      '<tr><td>B</td></tr></tbody></table>';
    return host.firstElementChild;
  };
  const cellNamed = (table, text) =>
    [...table.querySelectorAll('th, td')].find(c => c.textContent.trim() === text);
  /** Every slot of the grid, row by row: '·' is an empty cell, '×' no cell. */
  const shape = (table) => {
    const g = tbl.gridOf(table);
    return g.grid.map(row =>
      Array.from({ length: g.width }, (_, c) =>
        row[c] ? (row[c].textContent.trim() || '·') : '×').join(' ')).join(' / ');
  };
  /** 'rowsxcols' of the named cell — or 'gone', which is a result too. */
  const span = (table, text) => {
    const cell = cellNamed(table, text);
    return cell ? `${cell.rowSpan}x${cell.colSpan}` : 'gone';
  };

  // ── a row inserted across a merged cell ──────────────────────────────────
  let table = fixture();
  tbl.insertRow(table, cellNamed(table, 'A'), true);
  t('a row below A stretches the merged cell by exactly one',
    span(table, 'merged'), '3x2');
  t('…and the new row holds only the cells the merge does not cover',
    shape(table), 'merged merged A / merged merged · / merged merged B');

  table = fixture();
  tbl.insertRow(table, cellNamed(table, 'B'), false);
  t('a row above B lands inside the merge the same way',
    shape(table), 'merged merged A / merged merged · / merged merged B');

  table = fixture();
  tbl.insertRow(table, cellNamed(table, 'B'), true);
  t('a row below the last one is a plain new row',
    shape(table), 'merged merged A / merged merged B / · · ·');

  // ── a column deleted out of a merged cell ────────────────────────────────
  table = fixture();
  tbl.deleteColumn(table, cellNamed(table, 'merged'));
  t('deleting one of the merged columns keeps the text',
    cellNamed(table, 'merged') ? 'merged' : 'gone', 'merged');
  t('…leaves it one column wide and as tall as it was',
    span(table, 'merged'), '2x1');
  t('…and the table keeps its other columns', shape(table), 'merged A / merged B');

  // Nothing is left starting in the lower row once B's column goes, so the row
  // goes with it and the merge stops claiming to cover it.
  table = fixture();
  tbl.deleteColumn(table, cellNamed(table, 'A'));
  t('deleting the far column leaves the merge with the text and the width',
    span(table, 'merged') + ' ' + shape(table), '1x2 merged merged');

  // ── the symmetric column insertion ───────────────────────────────────────
  table = fixture();
  tbl.insertColumn(table, cellNamed(table, 'merged'), true);
  t('a column right of the merge is a column, not a wider merge',
    span(table, 'merged'), '2x2');
  t('…and every row gets its cell in it',
    shape(table), 'merged merged · A / merged merged · B');

  table = fixture();
  tbl.insertColumn(table, cellNamed(table, 'merged'), false);
  t('a column left of the merge covers both of its rows',
    shape(table), '· merged merged A / · merged merged B');

  table = fixture();
  tbl.insertColumn(table, cellNamed(table, 'A'), false);
  t('a column between the merge and A splits them',
    shape(table), 'merged merged · A / merged merged · B');

  // A column inserted beside a cell that is only tall still needs a cell in the
  // row that cell merely passes through.
  table = fixture('<table><tbody><tr><td rowspan="2">tall</td><td>x</td></tr>' +
                  '<tr><td>y</td></tr></tbody></table>');
  tbl.insertColumn(table, cellNamed(table, 'tall'), false);
  t('a column left of a rowspan is not skipped in its lower rows',
    shape(table), '· tall x / · tall y');

  table = fixture('<table><tbody><tr><td rowspan="2">tall</td><td>x</td></tr>' +
                  '<tr><td>y</td></tr></tbody></table>');
  tbl.insertColumn(table, cellNamed(table, 'x'), true);
  t('…nor at the right-hand edge', shape(table), 'tall x · / tall y ·');

  // ── the symmetric row deletion ───────────────────────────────────────────
  table = fixture();
  tbl.deleteRow(table, cellNamed(table, 'B'));
  t('deleting the lower row shortens the merge to what is left',
    shape(table), 'merged merged A');
  t('…and it is one row by two columns now',
    span(table, 'merged'), '1x2');

  table = fixture();
  tbl.deleteRow(table, cellNamed(table, 'A'));
  t('deleting the row a merge starts in moves it down, one shorter',
    shape(table), 'merged merged B');

  // A column whose rows hold nothing else leaves no row behind claiming to be
  // covered by a span that no longer reaches it.
  table = fixture('<table><tbody><tr><td rowspan="2">tall</td><td>x</td></tr>' +
                  '<tr><td>y</td></tr></tbody></table>');
  tbl.deleteColumn(table, cellNamed(table, 'x'));
  t('a column deletion that empties a row shrinks the span reaching into it',
    shape(table), 'tall');

  // ── the result is still a note that can be saved and opened again ────────
  table = fixture();
  tbl.insertRow(table, cellNamed(table, 'A'), true);
  tbl.insertColumn(table, cellNamed(table, 'A'), true);
  const edited = table.outerHTML;
  t('an edited merged table round trips through Markdown',
    mdToHtml(htmlToMd(edited)), edited);
  t('…and through a whole note file', (() => {
    const doc = { meta: { title: 'T', created: '01JAN2026', modified: '01JAN2026',
                          font: 'Roboto', view: null },
                  elements: [{ id: 't1', type: 'text', x: 0, y: 0, w: 300, html: edited }] };
    return parseNote(serializeNote(doc)).elements[0].html;
  })(), edited);
  // Undo restores a document snapshot wholesale, so what it has to survive is
  // that same round trip: the geometry has to still be there to put back.
  t('the spans survive that trip', (() => {
    const back = fixture(mdToHtml(htmlToMd(edited)));
    return span(back, 'merged') + ' ' + shape(back);
  })(), '3x2 merged merged A · / merged merged · · / merged merged B ·');
}

out.insertAdjacentHTML('beforeend', '<h2>Line wrapping</h2>');
t('soft wrap flows',   mdToHtml('line one\nline two'), '<p>line one line two</p>');
t('hard break kept',   mdToHtml('one\\\ntwo'), '<p>one<br>two</p>');
t('two-space break',   mdToHtml('one  \ntwo'), '<p>one<br>two</p>');

out.insertAdjacentHTML('beforeend', '<h2>Saving</h2>');

// The store is driven against stub API responses that can be held open, which
// is the only way to see what an edit made *during* a write is worth. Nothing
// here touches the real notebook or normal browser storage: every endpoint the
// store calls is replaced for the rest of the page, and wb:last lives in a
// fresh in-memory Storage-shaped object.
await (async () => { try {
  const { M_store, api } = __test;
  const { store, open, commit, saveNow, touchView, undo, logAction, revertTo,
          reloadChanged, settle, moveFile, trashFile, restoreFile, useStorage } = M_store;

  const stored = new Map();
  const testStorage = {
    getItem: key => stored.has(key) ? stored.get(key) : null,
    setItem: (key, value) => stored.set(key, String(value)),
    removeItem: key => stored.delete(key),
  };
  useStorage(testStorage);

  const A = '__test-store-A.md', B = '__test-store-B.md';
  const noteText = (name, body) => `---
title: ${name}
created: 01JAN2026
modified: 01JAN2026
font: Roboto
elements:
  - id: t1
    type: text
    x: 0
    y: 0
    w: 300
---

<!--@t1-->
${body}
`;

  const disk = { [A]: noteText('A', 'first'), [B]: noteText('B', 'other') };
  const writes = [];            // every PUT the store made, newest last
  const waiting = [];           // held responses, in the order they were asked for
  let hold = false;
  let fails = false;

  api.read = path => Promise.resolve({ text: disk[path], mtime: 1 });
  api.write = (path, text) => {
    writes.push({ path, text });
    if (fails) return Promise.reject(new Error('disk on fire'));
    const land = res => { disk[path] = text; res({ mtime: writes.length + 1 }); };
    if (!hold) return new Promise(land);
    return new Promise(res => waiting.push(() => land(res)));
  };
  api.actions = () => Promise.resolve({ actions: [] });
  api.setActions = () => Promise.resolve({});
  const tick = () => new Promise(r => setTimeout(r, 0));
  // A queued write only reaches api.write a microtask later, so hold-and-release
  // has to wait for the request to actually be made before answering it.
  const asked = async () => { for (let i = 0; !waiting.length && i < 100; i++) await tick(); };
  const release = async () => { await asked(); (waiting.shift() || (() => {}))(); };
  const edit = html => { store.doc.elements[0].html = html; commit(); };
  const body = path => { const d = document.createElement('div');
                         d.innerHTML = parseNote(disk[path]).elements[0].html;
                         return d.textContent.trim(); };

  // ── an edit made while a save is in flight is not saved by that save ──────
  await open(A);
  edit('<p>one</p>');
  hold = true;
  const inFlight = saveNow();
  await asked();
  edit('<p>two</p>');
  await release();
  await inFlight;
  t('edit during a save stays dirty', store.dirty, true);
  t('the in-flight save wrote only what it left with', body(A), 'one');

  // ── …and switching notes right afterwards still takes it to disk ──────────
  hold = false;
  await open(B);
  t('switching notes writes the pending edit', body(A), 'two');
  t('the second note is the open one', store.path, B);

  // ── overlapping saves cannot land out of order ───────────────────────────
  await open(A);
  t('reopening shows the newer edit', store.doc.elements[0].html, '<p>two</p>');
  hold = true;
  edit('<p>three</p>');
  const first = saveNow();
  await asked();
  edit('<p>four</p>');
  const second = saveNow();
  await tick(); await tick();
  t('a second write waits for the first', waiting.length, 1);
  await release(); await first;
  await release(); await second;
  t('the later write wins', body(A), 'four');
  t('both edits are saved', store.dirty, false);
  hold = false;

  // Continuous edits must not hit an arbitrary save-drain limit.
  const ordinaryWrite = api.write;
  let editsDuringWrites = 0;
  api.write = async (path, text) => {
    const result = await ordinaryWrite(path, text);
    if (++editsDuringWrites <= 7) edit('<p>continuous ' + editsDuringWrites + '</p>');
    return result;
  };
  edit('<p>before continuous writes</p>');
  await open(B);
  t('navigation drains more than three successive dirty revisions', body(A), 'continuous 7');
  t('navigation only finishes after the old note is saved', store.path, B);
  api.write = ordinaryWrite;
  await open(A);

  // ── a failed save keeps the work and stops the navigation ────────────────
  edit('<p>five</p>');
  fails = true;
  let stopped = false;
  try { await open(B); } catch { stopped = true; }
  fails = false;
  t('a failed save stops the navigation', stopped, true);
  t('a failed save keeps the edit dirty', store.dirty, true);
  t('the note with the unsaved edit is still open', store.path, A);
  await saveNow();
  t('the retried save keeps the edit', body(A), 'five');

  // ── a write that comes back late cannot book a note that has moved on ────
  hold = true;
  edit('<p>six</p>');
  const stray = saveNow();
  await asked();
  const savedText = store.savedText;
  store.path = B;                       // as if a switch had happened meanwhile
  await release(); await stray;
  t('a late write cannot book another note', store.savedText, savedText);
  store.path = A;
  hold = false;
  await saveNow();

  // ── panning is persisted, but is not an edit ─────────────────────────────
  store.doc.meta.modified = '01JAN2020';
  store.doc.meta.view = { x: 5, y: 7, scale: 1 };
  touchView();
  await saveNow();
  t('a pan does not bump modified', store.doc.meta.modified, '01JAN2020');
  t('a pan still reaches disk', JSON.stringify(parseNote(disk[A]).meta.view),
    JSON.stringify({ x: 5, y: 7, scale: 1 }));

  out.insertAdjacentHTML('beforeend', '<h2>File lifecycle</h2>');

  // Renaming, trashing and restoring move the file under the open document, so
  // each one is watched for the same thing: what the note still owed the disk
  // at the moment the file moved, and what the store thought was open after.
  const trashed = [];           // { path, text } as the note went to .trash
  const versions = {};          // stored versions, plus what a restore replaced
  const logged = [];            // every action-log write, newest last
  let renameAsked = null;       // what was still owed when the rename went out

  const bodyOf = text => { const d = document.createElement('div');
                           d.innerHTML = parseNote(text).elements[0].html;
                           return d.textContent.trim(); };
  const moveKeys = (from, to) => {
    for (const key of Object.keys(disk)) {
      if (key !== from && !key.startsWith(from + '/')) continue;
      disk[to + key.slice(from.length)] = disk[key];
      delete disk[key];
    }
  };
  api.rename = (from, to) => {
    renameAsked = { dirty: store.dirty, writes: writes.length };
    moveKeys(from, to);
    return Promise.resolve({ path: to });
  };
  api.remove = path => {
    for (const key of Object.keys(disk)) {
      if (key !== path && !key.startsWith(path + '/')) continue;
      trashed.push({ path: key, text: disk[key] });
      delete disk[key];
    }
    return Promise.resolve({ trashed: path });
  };
  api.restore = (path, at) => {
    versions[at + ':replaced'] = disk[path];   // the server snapshots this first
    disk[path] = versions[at];
    return Promise.resolve({ path, mtime: 99 });
  };
  api.setActions = (path, actions) => { logged.push({ path, actions }); return Promise.resolve({}); };

  const C = '__test-store-C.md';

  // ── a rename settles the note first, and takes it with it ────────────────
  await open(A);
  edit('<p>renamed</p>');
  await moveFile(A, C);
  t('a rename writes the pending edit before it moves the file', renameAsked.dirty, false);
  t('the newest content is under the new name', body(C), 'renamed');
  t('the old name is gone', A in disk, false);
  t('the open note followed the rename', store.path, C);
  await saveNow();
  t('no save recreates the old name', A in disk, false);
  await open(C);
  t('the renamed note reopens with its content', store.doc.elements[0].html, '<p>renamed</p>');

  // ── …and so does a note inside a renamed folder ──────────────────────────
  const FA = '__test-store-f/A.md';
  disk[FA] = noteText('A', 'in a folder');
  await open(FA);
  edit('<p>folder edit</p>');
  await moveFile('__test-store-f', '__test-store-g');
  t('a note inside a renamed folder follows it', store.path, '__test-store-g/A.md');
  t('its latest content moved with it', body('__test-store-g/A.md'), 'folder edit');
  t('nothing is left under the old folder', FA in disk, false);

  // ── a renamed note keeps the undo stack parked under its old name ────────
  const D = '__test-store-D.md', E = '__test-store-E.md';
  disk[D] = noteText('D', 'start');
  await open(D);
  edit('<p>step one</p>');
  edit('<p>step two</p>');
  await open(B);                                  // parks D's undo stack
  await moveFile(D, E);
  await open(E);
  t('the undo history follows a rename', undo(), true);

  // ── renaming some other note leaves the open one alone ───────────────────
  await open(B);
  const other = await moveFile(E, '__test-store-E2.md');
  t('renaming another note leaves the open one open', store.path, B);
  t('…and reports that nothing moved under it', other.active, null);

  // ── a trashed note takes its pending work with it, and does not come back ─
  await open(C);
  edit('<p>doomed</p>');
  const closed = await trashFile(C);
  t('trashing the open note reports it closed', closed, true);
  t('no note is open afterwards', store.path, null);
  t('the trashed copy holds the work that was pending', bodyOf(trashed.at(-1).text), 'doomed');
  t('nothing editable is left of the trashed note', store.doc.elements[0].html, '<p><br></p>');
  edit('<p>ghost</p>');
  t('typing with nothing open is owed to no file', store.dirty, false);
  await saveNow();
  t('a pending save cannot recreate a trashed note', C in disk, false);

  // ── a restore keeps the work it steps away from ──────────────────────────
  const R = '__test-store-R.md';
  disk[R] = noteText('R', 'current');
  versions.v1 = noteText('R', 'old version');
  await open(R);
  edit('<p>unsaved work</p>');
  await restoreFile(R, 'v1');
  t('a restore writes pending work first, so history keeps it',
    bodyOf(versions['v1:replaced']), 'unsaved work');
  await open(R);
  t('the restored version is the one open now', body(R), 'old version');
  t('the restored note is not immediately overwritten', store.dirty, false);

  // ── an action logged while a rename is in flight lands under the new name ─
  const S = '__test-store-S.md', T = '__test-store-T.md';
  disk[S] = noteText('S', 'logged');
  await open(S);
  const plainRename = api.rename;
  let releaseRename = null;
  api.rename = (from, to) => new Promise(res => {
    releaseRename = () => plainRename(from, to).then(res);
  });
  const renaming = moveFile(S, T);
  for (let i = 0; !releaseRename && i < 100; i++) await tick();
  logged.length = 0;
  const blockedInput = new Event('beforeinput', { bubbles: true, cancelable: true });
  window.dispatchEvent(blockedInput);
  t('input is blocked while a rename is in flight', blockedInput.defaultPrevented, true);
  t('the editor is locked during the mutation', M_store.editingBlocked(), true);
  let concurrentOpenBlocked = false;
  try { await open(B); } catch { concurrentOpenBlocked = true; }
  t('navigation cannot race the filesystem mutation', concurrentOpenBlocked, true);
  logAction('Logged mid-rename');
  releaseRename();
  await renaming;
  api.rename = plainRename;
  t('the editor stays locked until the renamed file is reloaded', M_store.editingBlocked(), true);
  await open(T);
  t('reloading the renamed file unlocks the editor', M_store.editingBlocked(), false);
  await settle();
  t('an action logged during a rename is written under the new name',
    logged.at(-1) && logged.at(-1).path, T);

  // ── snapshots taken before a rename follow the images the rename moved ───
  // The server answers a rename with what it did — {old image: new image} and
  // the note's new title — so the documents held in memory can be brought
  // forward the way the ones on disk were.
  const G = '__test-store-G.md', H = '__test-store-H.md';
  const renamed = api.rename;
  api.rename = (from, to) => {
    moveKeys(from, to);
    return Promise.resolve({ path: to, title: 'H', images: { 'G1.png': 'H1.png' } });
  };
  const pasted = '<p><img src="images/G1.png"> and images/G1.png named in prose</p>';
  const carried = '<p><img src="images/H1.png"> and images/G1.png named in prose</p>';

  disk[G] = noteText('G', 'start');
  await open(G);
  store.doc.elements[0].html = pasted;
  store.doc.elements.push({ id: 'canvas-image', type: 'image', src: 'images/G1.png', x: 0, y: 0, w: 20, h: 20 });
  commit('Pasted an image');
  edit('<p>typed on afterwards</p>');
  await moveFile(G, H);
  const step = store.actions.find(a => a.label === 'Pasted an image');
  t('canvas image sources in action history follow a rename',
    JSON.parse(step.snap).elements.find(e => e.type === 'image').src, 'images/H1.png');
  t('canvas image sources in undo history follow a rename',
    JSON.parse(store.history.find(e => JSON.parse(e.snap).elements.some(x => x.type === 'image')).snap)
      .elements.find(e => e.type === 'image').src, 'images/H1.png');
  t('a step logged before a rename points at the image the rename made',
    JSON.parse(step.snap).elements[0].html, carried);
  t('…and prose that merely names the path is left alone',
    JSON.parse(step.snap).elements[0].html.includes('images/G1.png named'), true);
  t('…and it carries the note\u2019s new title', JSON.parse(step.snap).meta.title, 'H');
  revertTo(step.id);
  t('going back to that step restores the image where it now is',
    store.doc.elements[0].html, carried);

  // ── …including an undo stack parked while another note was open ──────────
  const P = '__test-store-P.md', Q = '__test-store-Q.md';
  api.rename = (from, to) => {
    moveKeys(from, to);
    return Promise.resolve({ path: to, title: 'Q', images: { 'P1.png': 'Q1.png' } });
  };
  disk[P] = noteText('P', 'start');
  await open(P);
  edit('<p><img src="images/P1.png"></p>');
  await open(B);                                  // parks P's undo stack
  await moveFile(P, Q);
  await open(Q);
  undo();
  t('an undo into a parked stack lands on the moved image',
    store.doc.elements[0].html, '<p><img src="images/Q1.png"></p>');
  api.rename = async () => { throw new Error('rename failed'); };
  let failedRename = false;
  try { await moveFile(Q, P); } catch { failedRename = true; }
  t('a failed rename is reported', failedRename, true);
  t('a failed rename unlocks the editor', M_store.editingBlocked(), false);
  t('a failed rename retains the active identity', store.path, Q);
  api.rename = renamed;

  out.insertAdjacentHTML('beforeend', '<h2>Navigation ordering</h2>');

  // Reads are held independently so their responses can be delivered in the
  // opposite order from the clicks that asked for them.
  const NA = '__test-nav-A.md', NB = '__test-nav-B.md';
  disk[NA] = noteText('Nav A', 'older selection');
  disk[NB] = noteText('Nav B', 'latest selection');
  const reads = new Map();
  api.read = path => new Promise((resolve, reject) => reads.set(path, { resolve, reject }));
  const readAsked = async path => {
    for (let i = 0; !reads.has(path) && i < 100; i++) await tick();
  };
  const answerRead = (path, text = disk[path], mtime = 40) => {
    const request = reads.get(path); reads.delete(path);
    request.resolve({ text, mtime });
  };

  const firstOpen = open(NA);
  await readAsked(NA);
  const latestOpen = open(NB);
  await readAsked(NB);
  answerRead(NB);
  t('the latest navigation applies', await latestOpen, true);
  answerRead(NA);
  t('an older navigation reports that it was superseded', await firstOpen, false);
  t('reversed read completion leaves the latest note active', store.path, NB);
  t('reversed read completion leaves the latest document visible',
    store.doc.elements[0].html, '<p>latest selection</p>');
  t('reversed read completion keeps the latest save metadata', store.savedText, disk[NB]);
  t('reversed read completion keeps the latest remembered note',
    testStorage.getItem('wb:last'), NB);

  // A rejected request is just as stale as a successful one once a later click
  // has won. It resolves false, so main.go neither selects it nor shows its error.
  const staleError = open(NA);
  await readAsked(NA);
  const successful = open(NB);
  await readAsked(NB);
  answerRead(NB, disk[NB], 41);
  await successful;
  const oldFailure = reads.get(NA); reads.delete(NA);
  oldFailure.reject(new Error('old read failed'));
  t('an error from a superseded navigation is ignored', await staleError, false);
  t('a stale error cannot replace the newer successful note', store.path, NB);

  // The watcher captures both visit identity and save metadata before reading.
  // Even A → B → A would reject the first visit's response by token; this
  // simpler A → B case also proves it cannot put A over B.
  const external = reloadChanged(NB);
  await readAsked(NB);
  const away = open(NA);
  await readAsked(NA);
  answerRead(NA, disk[NA], 42);
  await away;
  answerRead(NB, noteText('Nav B', 'changed outside'), 43);
  t('a watcher read for a note left meanwhile is discarded', await external, false);
  t('a delayed watcher read leaves the newly opened note active', store.path, NA);
  t('a delayed watcher read leaves the newly opened document visible',
    store.doc.elements[0].html, '<p>older selection</p>');

  // A note can still be edited while the destination read is away. The current
  // navigation settles that edit a second time before replacing the document.
  api.read = path => path === NB
    ? new Promise((resolve, reject) => reads.set(path, { resolve, reject }))
    : Promise.resolve({ text: disk[path], mtime: 44 });
  await open(NA);
  const editWhileReading = open(NB);
  await readAsked(NB);
  edit('<p>typed while B was loading</p>');
  answerRead(NB, disk[NB], 45);
  await editWhileReading;
  t('an edit made during navigation is saved before the note changes',
    body(NA), 'typed while B was loading');
  t('navigation after that save still opens its requested note', store.path, NB);

  // Action-log reads are guarded by the same visit token. Path alone would not
  // protect A → B → A, where the first and third visits have the same name.
  const actionReads = new Map();
  api.read = path => Promise.resolve({ text: disk[path], mtime: 46 });
  api.actions = path => new Promise(resolve => actionReads.set(path, resolve));
  await open(NA);
  await open(NB);
  const action = label => ({ id: label, label, at: 1, snap: JSON.stringify(store.doc) });
  actionReads.get(NB)({ actions: [action('Latest action')] });
  await tick();
  t('the latest note receives its own delayed action log', store.actions[0].label, 'Latest action');
  actionReads.get(NA)({ actions: [action('Stale action')] });
  await tick();
  t('a superseded action-log response cannot enter the latest note',
    store.actions.map(a => a.label).join('|'), 'Latest action');

  // Let the action log's debounce fire into the stub, so no beacon carrying a
  // test path is left queued for when this page closes.
  await new Promise(r => setTimeout(r, 1700));
  } catch (e) { t('store tests ran to the end', String(e && e.message || e), 'no error'); }
})();

document.getElementById('head').textContent = `${pass} passed, ${fail} failed`;
document.getElementById('head').className = fail ? 'bad' : 'ok';
document.title = fail ? `FAIL ${fail}` : `PASS ${pass}`;
</script></body></html>
